<div class="article-editor-container">
  <mat-card class="editor-card">
    <mat-card-header>
      <mat-card-title>{{ isEditing ? 'Modifier l\'article' : 'Nouvel article' }}</mat-card-title>
      <mat-card-subtitle>Créez et publiez votre contenu</mat-card-subtitle>
    </mat-card-header>
    
    <mat-card-content>
      <form [formGroup]="articleForm" class="editor-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Titre</mat-label>
          <input matInput formControlName="title" placeholder="Titre de votre article">
          <mat-error *ngIf="articleForm.get('title')?.hasError('required')">
            Le titre est requis
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Extrait</mat-label>
          <textarea matInput rows="2" formControlName="excerpt" placeholder="Court résumé de l'article"></textarea>
          <mat-error *ngIf="articleForm.get('excerpt')?.hasError('required')">
            L'extrait est requis
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contenu</mat-label>
          <textarea matInput rows="15" formControlName="content" placeholder="Contenu de l'article..."></textarea>
          <mat-error *ngIf="articleForm.get('content')?.hasError('required')">
            Le contenu est requis
          </mat-error>
        </mat-form-field>

        <div class="form-row">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Tags</mat-label>
            <input matInput formControlName="tags" placeholder="tag1, tag2, tag3">
            <mat-hint>Séparez les tags par des virgules</mat-hint>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Statut</mat-label>
            <mat-select formControlName="status">
              <mat-option value="draft">Brouillon</mat-option>
              <mat-option value="pending">En attente</mat-option>
              <mat-option value="published">Publié</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="form-actions">
          <button mat-button type="button" (click)="cancel()">Annuler</button>
          <button mat-raised-button color="primary" type="submit" [disabled]="!articleForm.valid || isLoading">
            <mat-icon *ngIf="!isLoading">{{ isEditing ? 'edit' : 'add' }}</mat-icon>
            <mat-progress-spinner *ngIf="isLoading" diameter="20"></mat-progress-spinner>
            {{ isLoading ? 'Enregistrement...' : (isEditing ? 'Mettre à jour' : 'Publier') }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
